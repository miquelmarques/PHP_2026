<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session - Login</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #222;
      }

      form {
        width: min(90vw, 380px);
        padding: 2rem;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      form > div {
        margin-bottom: 1.25rem;
      }

      label {
        display: block;
        margin-bottom: 0.4rem;
        font-weight: 600;
        font-size: 0.9rem;
      }

      input {
        width: 100%;
        padding: 0.7rem 0.9rem;
        font-size: 1rem;
        border: 2px solid #ddd;
        border-radius: 8px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
      }

      /* Validació visual: només quan l'usuari ja ha escrit alguna cosa */
      input:not(:placeholder-shown):valid {
        border-color: #2e9e5b;
      }

      input:not(:placeholder-shown):invalid {
        border-color: #d64545;
      }

      button[type="submit"] {
        width: 100%;
        padding: 0.8rem;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: #667eea;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
      }

      button[type="submit"]:hover {
        background: #5568d3;
      }

      button[type="submit"]:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div>
      <form action="login.php" method="post">
        <div>
          <label for="user">Usuari:</label>
          <br />
          <input
            type="text"
            placeholder="Introdueix el usuari"
            id="user"
            name="user"
            pattern="8[a-Z0-9]{8} required"
          />
        </div>

        <div>
          <label for="pass">Contrassenya:</label>
          <input
            type="password"
            placeholder="Introdueix el usuari"
            id="pass"
            name="pass"
            pattern="[a-Z0-9@!.,]{8-20} required"
          />
          <br />
        </div>
        <button type="submit">Inicia Sessió</button>
      </form>
    </div>
  </body>
</html>
